[workspace]
members = [
    "crates/dedupus_core",
    "crates/dedupus_cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BerryUIKI"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/BerryUIKI/Dedupus"

[workspace.dependencies]
# Core internal crates
dedupus_core = { path = "crates/dedupus_core" }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# Hashing
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Parallelism & Concurrency
rayon = "1.10"
crossbeam-channel = "0.5"

# File & I/O
walkdir = "2.5"
ignore = "0.4"
memmap2 = "0.9"
trash = "5.2"
dirs = "7.0"

# Serialization & Error handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Media & Image/Audio hashing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "ogg", "vorbis"] }

# File content detection (bad-extension scanner)
infer = "0.22"

# Windows shortcut parsing (broken .lnk detection)
lnk = "0.6"

# Testing
tempfile = "3.10"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
